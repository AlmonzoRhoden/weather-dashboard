    <!-- Start HTML Body -->

    <div class="container-fluid">
        <div class="card">
            <div class="card-body text-center bg-dark text-white">
                <h1>Almonzo's <br> Weather Dashboard</h1>

                <!--Audio player for site bgm theme-->
                <p>Weather Mystery ♫</p>
                <audio controls id="myaudio">
                  <source controls src="./assets/background/Weather Mystery.mp3" type="audio/mpeg">
                  Your browser does not support the audio element.
                </audio>
                <br> 
                <!--Buy me a coffee button!-->
            <button id="supportBtn"><a href="https://buymeacoffee.com/almonzorhoden" target="_blank">Buy me a coffee!</a></button>
            </div>
            
        </div>

        <!-- Container-->
        <div class="container-fluid">
            <div class="row">
                <div class="col">
                    <div class="card-body text-center">
                        <!-- Search input stuff go here -->

                        <div class="card" style="width: 18rem;">
                            <div class="card-body bg-light">
                                <h6 class="card-subtitle mb-2 text-muted">Search by city name or zip code</h6>
                                <div class="input-group mb-3">
                                    <input type="text" class="form-control searchInput" placeholder="City Name or Zipcode"
                                        aria-label="Recipient's username" aria-describedby="button-addon2">
                                    <div class="input-group-append">
                                        <button class="btn btn-outline-secondary bg-primary searchButton" type="button"
                                            id="button-addon2"><i class="fas fa-search"></i></button>
                                    </div>
                                </div>

                                <ul class="list-group">

                                </ul>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- current weather forecast-->
                <div class="col mt-4 mr-5">
                    <div class="card currentCard pb-2 pt-1">
                        <h5 class="card-title mt-2 text-center">Current Forecast</h5>
                    </div>
                </div>
                <div class="row">
                    <div class="col mt-4">
                        <div class="card pb-5 fiveDayCard pl-5">
                            <!--  five day forecast-->
                            <h5 class="card-title mt-2 mr-5">5-Day Forecast </h5>
                            <div class="row">
                                <div class="col fiveDayOne">
                                </div>

                            </div>

                        </div>
                    </div>
                </div>
            </div>
        </div>

    <script src="./assets/javascript/script.js"></script>
